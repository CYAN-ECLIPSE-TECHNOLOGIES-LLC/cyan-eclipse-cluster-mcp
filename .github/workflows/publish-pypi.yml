name: Publish to PyPI

# Gate S5 (applies to every artifact in the PyPI slate): releases
# build ONLY here, from a tagged commit, and publish via Trusted
# Publishing (OIDC) - no long-lived PyPI tokens anywhere, no laptop
# uploads. PEP 740 attestations are generated by the publish action.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the test suite
        run: python -m unittest discover -s tests

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build

      - name: twine check
        run: |
          pip install twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/eclipse-cluster/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (Trusted Publishing, PEP 740 attestations)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
