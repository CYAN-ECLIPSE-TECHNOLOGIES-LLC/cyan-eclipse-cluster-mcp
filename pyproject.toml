[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyan-eclipse-cluster"
version = "0.1.0"
description = "Signed images, governed runtimes \u2014 the gate runs first: no verified signature and provenance, no workload."
readme = "PYPI_README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Cyan Eclipse Technologies LLC" },
]
keywords = ["mcp", "model-context-protocol", "containers", "cosign", "supply-chain-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://cetech.ai"
Repository = "https://github.com/CYAN-ECLIPSE-TECHNOLOGIES-LLC/eclipse-cluster-mcp"
Vendor = "https://cetech.ai"

[project.scripts]
eclipse-cluster = "server:main_stdio"

# Version lockstep: this version, the VERSION file, server.json, and the
# server.py version string all read 0.1.0 - bump them together.
# Flat layout: the runtime is the top-level server.py module. Runtime
# data read beside server.py (Path(__file__).parent / ...) is
# force-included at the same relative path in the wheel.
[tool.hatch.build.targets.wheel.force-include]
"server.py" = "server.py"
"registry.py" = "registry.py"
"sigverify.py" = "sigverify.py"
"bazaar-manifest.json" = "bazaar-manifest.json"
"policies/default.json" = "policies/default.json"
"policies/signature-only.json" = "policies/signature-only.json"
"trust-bundle.example.json" = "trust-bundle.example.json"

[tool.hatch.build.targets.sdist.force-include]
"server.py" = "server.py"
"registry.py" = "registry.py"
"sigverify.py" = "sigverify.py"
"bazaar-manifest.json" = "bazaar-manifest.json"
"policies/default.json" = "policies/default.json"
"policies/signature-only.json" = "policies/signature-only.json"
"trust-bundle.example.json" = "trust-bundle.example.json"
